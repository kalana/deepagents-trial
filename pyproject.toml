[project]
name = "deepagents-trial"
version = "0.1.0"
description = "Learning project: a cited research-brief agent built on LangChain Deep Agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "langchain-openrouter",
    "langchain-tavily",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_brief"]
